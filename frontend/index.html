<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- ═══════════════════════════════════════
         FAVICONS (all sizes)
    ═══════════════════════════════════════ -->
    <link rel="icon" type="image/png" href="/logo11.png" />

    <!-- Apple Touch Icon (iOS home screen) -->
    <link rel="apple-touch-icon" href="/logo11.png" />

    <!-- Web App Manifest (Android) -->
    <link rel="manifest" href="/site.webmanifest" />

    <!-- ═══════════════════════════════════════
         SEO & PAGE META
    ═══════════════════════════════════════ -->
    <title>Mason — Women Wear | Ethnic • Party • Comfort</title>
    <meta name="description" content="Mason Women Wear — Discover premium ethnic, party, and comfort wear. Curated collections for the modern woman who values elegance, quality, and effortless style." />
    <meta name="keywords"    content="mason women wear, ethnic wear, party wear, western wear, premium fashion, women clothing india" />
    <meta name="author"      content="House of Mason" />
    <meta name="theme-color" content="#FAF6F1" />

    <!-- ═══════════════════════════════════════
         OPEN GRAPH (Facebook, WhatsApp, LinkedIn)
    ═══════════════════════════════════════ -->
    <meta property="og:type"        content="website" />
    <meta property="og:site_name"   content="Mason" />
    <meta property="og:url"         content="https://mason-jade.vercel.app" />
    <meta property="og:title"       content="Mason — The Art of Femininity" />
    <meta property="og:description" content="Premium women's ethnic, party & western wear. Curated collections crafted for the modern woman." />
    <meta property="og:image"       content="https://mason-jade.vercel.app/og-image.jpeg" />
    <meta property="og:image:secure_url" content="https://mason-jade.vercel.app/og-image.jpeg" />
    <meta property="og:image:type"   content="image/jpeg" />
    <meta property="og:image:width"  content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt"    content="Mason Women Wear" />
    <meta property="og:locale"       content="en_IN" />

    <!-- Schema.org for Google and some aggressive scrapers (WhatsApp) -->
    <meta itemprop="name" content="Mason — The Art of Femininity" />
    <meta itemprop="description" content="Premium women's ethnic, party & western wear." />
    <meta itemprop="image" content="https://mason-jade.vercel.app/og-image.jpeg" />

    <!-- ═══════════════════════════════════════

    ═══════════════════════════════════════ -->
